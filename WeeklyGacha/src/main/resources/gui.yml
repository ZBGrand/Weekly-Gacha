      - "<#8a7a66>ᴄᴏsᴛ <dark_gray>» <#F4B554>{cost}"
      - "<#8a7a66>ʏᴏᴜ ʜᴀᴠᴇ <dark_gray>» <white>{balance}"

# ---------------------------------------------------------------------
#  Hoat anh lat the (thoi gian chinh o config.yml, muc animation)
# ---------------------------------------------------------------------
animation:
  card-back:                   # the up luc dang xao tron
    material: BROWN_STAINED_GLASS_PANE
    name: "<#F4B554>?"
  glow-pane-name: "{rarity-color}✦"   # ten tam kinh sang theo do hiem truoc khi lat. Bien: {rarity-color}
  spin-palette:                # cac mau the nhap nhay luc xao tron
    - BROWN_STAINED_GLASS_PANE
    - ORANGE_STAINED_GLASS_PANE
    - YELLOW_STAINED_GLASS_PANE
    - RED_STAINED_GLASS_PANE
    - GRAY_STAINED_GLASS_PANE
    - LIGHT_GRAY_STAINED_GLASS_PANE
  flash:                       # vien nhap nhay khi lat the hiem
    materials: [ORANGE_STAINED_GLASS_PANE, YELLOW_STAINED_GLASS_PANE, WHITE_STAINED_GLASS_PANE]
    # symbols: cac ky tu trong result.layout se nhap nhay (uu tien hon "slots" kieu cu)
    symbols: "~o"
    count:                     # so lan nhap nhay theo do hiem (0 = khong nhap nhay)
      COMMON: 0
      UNCOMMON: 0
      RARE: 0
      EPIC: 3
      LEGENDARY: 6

# ---------------------------------------------------------------------
#  Am thanh.  Moi phan tu: "khoa-am-thanh am-luong cao-do"  (am luong, cao do co the bo).
#  Khoa am thanh la ten tren wiki Minecraft, vd block.note_block.pling. Ghi "none" de tat.
# ---------------------------------------------------------------------
sounds:
  spin:                        # tieng "tach" luc xao tron, cao do tang dan
    sound: "block.note_block.hat"
    volume: 0.6
    pitch-start: 0.7
    pitch-step: 0.05
    pitch-max: 2.0
  tint:                        # khi the sang theo do hiem (truoc khi lat)
    COMMON: ["block.note_block.pling 0.8 0.9"]
    UNCOMMON: ["block.note_block.pling 0.8 1.1"]
    RARE: ["block.note_block.pling 0.9 1.4"]
    EPIC: ["block.note_block.pling 1.0 1.8"]
    LEGENDARY: ["block.beacon.activate 1.0 1.2"]
  reveal:                      # khi lat the
    COMMON: ["entity.experience_orb.pickup 0.8 1.0"]
    UNCOMMON: ["entity.experience_orb.pickup 0.8 1.0"]
    RARE: ["block.amethyst_block.chime 1.0 1.2"]
    EPIC: ["entity.player.levelup 1.0 1.0"]
    LEGENDARY:
      - "ui.toast.challenge_complete 1.0 1.0"
      - "entity.firework_rocket.blast 1.0 1.0"
  result-high-rarity: EPIC     # tu do hiem nay tro len thi dung am thanh result-high khi hien ket qua
  result-high: ["ui.toast.challenge_complete 1.0 1.0"]
  result-normal: ["entity.player.levelup 1.0 1.0"]
  spark-exchanged: ["ui.toast.challenge_complete 1.0 1.0"]
