  again-single:
    slot: 41
    material: GOLD_NUGGET
    name: "<gradient:#F4B554:#F6955D><bold>ᴘᴜʟʟ ᴀɢᴀɪɴ x{count}"
    lore:
      - "<#4a3d30>━━━━━━━━━━━━━━━━━━━━"
      - "<#8a7a66>ᴄᴏsᴛ <dark_gray>» <#F4B554>{cost}"
      - "<#8a7a66>ʏᴏᴜ ʜᴀᴠᴇ <dark_gray>» <white>{balance}"
  again-ten:
    slot: 41
    material: GOLD_INGOT
    amount: 10
    glow: true
    name: "<gradient:#F6955D:#ff5f6d><bold>ᴘᴜʟʟ ᴀɢᴀɪɴ x{count}"
    lore:
