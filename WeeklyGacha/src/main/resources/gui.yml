# =====================================================================
#  WeeklyGacha 1.5.0 - giao dien (gui.yml)
#  Sua file nay roi chay /gachaadmin reload (khong can build lai plugin).
#
#  CACH VIET
#   - Chu dung MiniMessage: <gold>, <bold>, <gradient:#ff5f6d:#ffc371>, <#F4B554> ...
#   - {ten} la bien do plugin dien vao. Moi muc ben duoi ghi ro co nhung bien nao.
#   - Dong lore bat dau bang [if:dieu-kien] chi hien khi dieu kien bat,
#     [if:!dieu-kien] chi hien khi dieu kien tat. Co the ghep: [if:a][if:!b]text
#   - Dong lore chi gom mot khoi, vi du {description}, se duoc thay bang nhieu dong.
#   - Moi vat pham co: material, amount, name, lore, glow (true/false), slot (o trong GUI).
#     Them (1.5.0): custom-model-data: <so> (cho resource pack), hide-tooltip: true (khong hien khung khi re chuot).
#     Dat "enabled: false" de an vat pham do. Slot di tu 0 (tren-trai) toi 8 (tren-phai),
#     hang 2 bat dau o 9, ... hang 6 bat dau o 45.
#   - Danh sach o co the viet khoang: ["10-16", "19-25"] = 10,11,...,16,19,...,25
#   - Muc nao bi xoa se tu lay lai gia tri mac dinh cua plugin.
#
#  LAYOUT (moi tu 1.5.0)
#   Moi menu co "layout": danh sach dong, moi dong 9 ky tu = 9 o. Moi ky tu la mot "decor"
#   (mieng trang tri) khai bao o muc "decor" ben duoi. Nut va vat pham that duoc dat DE LEN layout.
#     - Ky tu khoang trang hoac dau cham "." = de nen filler.
#     - Muon tro lai kieu cu (phu kin filler) thi ghi: layout: []
#   Decor co the DONG (doi hinh lien tuc) khi co "frames" (danh sach chat lieu):
#     mode: chase   chay vong quanh GUI theo chieu kim dong ho (frames[0] la "dau", cac frame sau la "duoi")
#           blink   tat ca o cung doi hinh mot luc
#           wave    song chay tu trai sang phai theo cot
#           random  moi o doi hinh ngau nhien
#     speed: so nhip (1 nhip = 2 tick = 0.1 giay) giua 2 lan doi hinh
#   Thu tu tim decor cua mot ky tu: themes.<id-banner>.decor -> <menu>.decor -> decor (chung).
#
#  THEME THEO BANNER (moi tu 1.5.0)
#   themes.<id-banner>.decor ghi de decor khi nguoi choi dang xem banner do
#   (menu chinh, ty le, spark, ket qua quay). Vi du doi mau vien chay cho tung banner.
# =====================================================================

# ---------------------------------------------------------------------
#  Chung
# ---------------------------------------------------------------------
general:
  filler:                      # nen cua cac o "." / khoang trang trong layout (va menu khong co layout)
    material: BLACK_STAINED_GLASS_PANE
    name: " "
    hide-tooltip: true
  background:                  # nen cua man hinh ket qua quay
    material: BLACK_STAINED_GLASS_PANE
    name: " "
    hide-tooltip: true

# ---------------------------------------------------------------------
#  Decor dung chung cho moi layout (decor luon an khung tooltip, tru khi ghi hide-tooltip: false)
# ---------------------------------------------------------------------
decor:
  "#":                         # nen toi
    material: BLACK_STAINED_GLASS_PANE
  "=":                         # o trong / be do (xam)
    material: GRAY_STAINED_GLASS_PANE
  "o":                         # diem nhan ho phach
    material: ORANGE_STAINED_GLASS_PANE
  "y":
    material: YELLOW_STAINED_GLASS_PANE
  "r":
    material: RED_STAINED_GLASS_PANE
  "~":                         # vien chay vong quanh GUI (2 "sao choi" mau ho phach)
    material: BLACK_STAINED_GLASS_PANE
    mode: chase
    speed: 2
    frames:
      - YELLOW_STAINED_GLASS_PANE
      - ORANGE_STAINED_GLASS_PANE
      - BROWN_STAINED_GLASS_PANE
      - BLACK_STAINED_GLASS_PANE
      - BLACK_STAINED_GLASS_PANE
      - BLACK_STAINED_GLASS_PANE
      - BLACK_STAINED_GLASS_PANE
      - BLACK_STAINED_GLASS_PANE
      - BLACK_STAINED_GLASS_PANE
      - BLACK_STAINED_GLASS_PANE
      - BLACK_STAINED_GLASS_PANE
      - BLACK_STAINED_GLASS_PANE
      - BLACK_STAINED_GLASS_PANE
  "*":                         # den nhap nhay
    material: ORANGE_STAINED_GLASS_PANE
    mode: blink
    speed: 6
    frames: [ORANGE_STAINED_GLASS_PANE, YELLOW_STAINED_GLASS_PANE]

# ---------------------------------------------------------------------
#  Theme theo banner: ghi de decor khi dang xem banner do. Khoa la ID banner trong banners.yml.
#  Banner khong co o day dung decor chung o tren.
# ---------------------------------------------------------------------
themes:
  standard_extraction:         # banner thuong: vien xanh la
    decor:
      "~":
        material: BLACK_STAINED_GLASS_PANE
        mode: chase
        speed: 2
        frames: [LIME_STAINED_GLASS_PANE, GREEN_STAINED_GLASS_PANE, BLACK_STAINED_GLASS_PANE, BLACK_STAINED_GLASS_PANE, BLACK_STAINED_GLASS_PANE, BLACK_STAINED_GLASS_PANE, BLACK_STAINED_GLASS_PANE, BLACK_STAINED_GLASS_PANE, BLACK_STAINED_GLASS_PANE, BLACK_STAINED_GLASS_PANE, BLACK_STAINED_GLASS_PANE, BLACK_STAINED_GLASS_PANE, BLACK_STAINED_GLASS_PANE]
      "o":
        material: LIME_STAINED_GLASS_PANE
      "*":
        material: GREEN_STAINED_GLASS_PANE
        mode: blink
        speed: 6
        frames: [GREEN_STAINED_GLASS_PANE, LIME_STAINED_GLASS_PANE]
  new_item_target_extraction:  # banner gioi han: vien do -> cam (giong mau ten banner)
    decor:
      "~":
        material: BLACK_STAINED_GLASS_PANE
        mode: chase
        speed: 2
        frames: [ORANGE_STAINED_GLASS_PANE, RED_STAINED_GLASS_PANE, RED_STAINED_GLASS_PANE, BLACK_STAINED_GLASS_PANE, BLACK_STAINED_GLASS_PANE, BLACK_STAINED_GLASS_PANE, BLACK_STAINED_GLASS_PANE, BLACK_STAINED_GLASS_PANE, BLACK_STAINED_GLASS_PANE, BLACK_STAINED_GLASS_PANE, BLACK_STAINED_GLASS_PANE, BLACK_STAINED_GLASS_PANE, BLACK_STAINED_GLASS_PANE]
      "o":
        material: RED_STAINED_GLASS_PANE
      "*":
        material: RED_STAINED_GLASS_PANE
        mode: blink
        speed: 6
        frames: [RED_STAINED_GLASS_PANE, ORANGE_STAINED_GLASS_PANE]
  assured_extraction:          # (neu ban them lai banner nay) vien vang kim
    decor:
      "~":
        material: BLACK_STAINED_GLASS_PANE
        mode: chase
        speed: 2
        frames: [WHITE_STAINED_GLASS_PANE, YELLOW_STAINED_GLASS_PANE, YELLOW_STAINED_GLASS_PANE, BLACK_STAINED_GLASS_PANE, BLACK_STAINED_GLASS_PANE, BLACK_STAINED_GLASS_PANE, BLACK_STAINED_GLASS_PANE, BLACK_STAINED_GLASS_PANE, BLACK_STAINED_GLASS_PANE, BLACK_STAINED_GLASS_PANE, BLACK_STAINED_GLASS_PANE, BLACK_STAINED_GLASS_PANE, BLACK_STAINED_GLASS_PANE]
      "o":
        material: YELLOW_STAINED_GLASS_PANE

# Ten, mau, tam kinh (trong hoat anh va vien ket qua) cua tung do hiem. Khoa phai la COMMON ... LEGENDARY.
rarity:
  COMMON:
    label: "ᴄᴏᴍᴍᴏɴ"
    color: "<gray>"
    pane: LIGHT_GRAY_STAINED_GLASS_PANE
  UNCOMMON:
    label: "ᴜɴᴄᴏᴍᴍᴏɴ"
    color: "<green>"
    pane: LIME_STAINED_GLASS_PANE
  RARE:
    label: "ʀᴀʀᴇ"
    color: "<aqua>"
    pane: LIGHT_BLUE_STAINED_GLASS_PANE
  EPIC:
    label: "ᴇᴘɪᴄ"
    color: "<light_purple>"
    pane: PURPLE_STAINED_GLASS_PANE
  LEGENDARY:
    label: "ʟᴇɢᴇɴᴅᴀʀʏ"
    color: "<gold>"
    pane: ORANGE_STAINED_GLASS_PANE

# Dinh dang so / thoi gian / chi phi
format:
  day: "days"
  hour: "hours"
  minute: "minutes"
  date: "dd/MM/yyyy HH:mm"      # mau ngay gio (Java DateTimeFormatter)
  rate: "0.###"                 # mau so thap phan cua ty le (phan tram)
  infinite: "∞"
  points: "{amount} ⛃"          # chi phi PlayerPoints. Bien: {amount}
  key: "{amount}x {name}"       # chi phi bang key.     Bien: {amount} {name}
  bar:                          # thanh tien do spark
    cells: 20
    filled: "<#F4B554>|"
    empty: "<#3a3128>|"

# ---------------------------------------------------------------------
#  The vat pham (dung o ty le, ket qua quay, chon spark, trung bay banner)
#  Bien : {name} {rarity} {rarity-color} {amount} {rate} {pity}
#  Dieu kien: amount (so luong > 1), rate (dang hien ty le), featured (vat pham noi bat),
#             pity (dang hien so luot ra sau lan hiem truoc), choose (dang chon spark)
#  Hinh dang cua the lay tu chinh vat pham, nen o day khong co material.
# ---------------------------------------------------------------------
reward-card:
  name: "{rarity-color}{name}"
  lore:
    - "<#4a3d30>━━━━━━━━━━━━━━━━━━━━"
    - "<#8a7a66>ʀᴀʀɪᴛʏ <dark_gray>» {rarity}"
    - "[if:amount]<#8a7a66>ᴀᴍᴏᴜɴᴛ <dark_gray>» <white>x{amount}"
    - "[if:rate]<#8a7a66>ʀᴀᴛᴇ <dark_gray>» <white>{rate}%"
    - "[if:pity]<#8a7a66>ᴏʙᴛᴀɪɴᴇᴅ ᴀғᴛᴇʀ <dark_gray>» <white>{pity} <#8a7a66>ᴘᴜʟʟs"
    - "[if:featured]"
    - "[if:featured]<gradient:#F4B554:#F6955D>★ ғᴇᴀᴛᴜʀᴇᴅ ɪᴛᴇᴍ"
    - "[if:choose]"
    - "[if:choose]<#F4B554>▶ ᴄʟɪᴄᴋ ᴛᴏ sᴇʟᴇᴄᴛ"

# ---------------------------------------------------------------------
#  Cac dong mo ta spark (dung lam khoi {spark-lines} va lenh /gacha spark)
#  Bien : {bar} {current} {threshold} {left} {exchanges} {rarity} {pity} {total}
#  Dieu kien: enabled (banner co spark), ready (da du diem de doi)
# ---------------------------------------------------------------------
spark-lines:
  - "[if:!enabled]<gray>ᴛʜɪs ʙᴀɴɴᴇʀ ʜᴀs ɴᴏ sᴘᴀʀᴋ."
  - "[if:!enabled]<#8a7a66>ᴛᴏᴛᴀʟ ᴘᴜʟʟs <dark_gray>» <white>{total}"
  - "[if:enabled]{bar} <white>{current}<dark_gray>/<white>{threshold}"
  - "[if:enabled]"
  - "[if:ready]<#F4B554>✦ ᴇɴᴏᴜɢʜ ᴘᴏɪɴᴛs: ʏᴏᴜ ᴄᴀɴ ᴇxᴄʜᴀɴɢᴇ <white>{exchanges}<#F4B554> ᴛɪᴍᴇ(s)."
  - "[if:enabled][if:!ready]<white>{left}<gray> ᴍᴏʀᴇ ᴘᴜʟʟ(s) ᴜɴᴛɪʟ ʏᴏᴜ ᴄᴀɴ ᴇxᴄʜᴀɴɢᴇ."
  - "[if:enabled]<gray>ᴇxᴄʜᴀɴɢᴇ ғᴏʀ 1 {rarity}<gray> ɪᴛᴇᴍ ᴏғ ʏᴏᴜʀ ᴄʜᴏɪᴄᴇ."
  - "[if:enabled]<#8a7a66>sɪɴᴄᴇ ᴛʜᴇ ʟᴀᴛᴇsᴛ {rarity}<dark_gray> » <white>{pity} <#8a7a66>ᴘᴜʟʟs"
  - "[if:enabled]<#8a7a66>ᴛᴏᴛᴀʟ ᴘᴜʟʟs <dark_gray>» <white>{total}"

# Quy tac spark (nut "Quy tac Spark" trong man hinh ty le)
#  Bien : {threshold} {rarity} {ten-rarity}
#  Dieu kien: enabled, featured (banner co vat pham noi bat), ten-guarantee
spark-rules:
  - "[if:!enabled]<gray>ᴛʜɪs ʙᴀɴɴᴇʀ ʜᴀs ɴᴏ sᴘᴀʀᴋ."
  - "[if:enabled]<#F4B554>① <gray>ᴇᴀᴄʜ ᴘᴜʟʟ ɢʀᴀɴᴛs <white>1<gray> sᴘᴀʀᴋ ᴘᴏɪɴᴛ."
  - "[if:enabled]<#F4B554>② <gray>ʀᴇᴀᴄʜ <white>{threshold}<gray> ᴘᴏɪɴᴛs: ᴇxᴄʜᴀɴɢᴇ ғᴏʀ 1 {rarity}<gray> ɪᴛᴇᴍ."
  - "[if:enabled][if:featured]<#F4B554>③ <gray>ᴏɴʟʏ sᴇʟᴇᴄᴛᴀʙʟᴇ ᴀᴍᴏɴɢ <yellow>ғᴇᴀᴛᴜʀᴇᴅ<gray> ɪᴛᴇᴍs."
  - "[if:enabled][if:!featured]<#F4B554>③ <gray>sᴇʟᴇᴄᴛᴀʙʟᴇ ᴀᴍᴏɴɢ ᴀʟʟ ɪᴛᴇᴍs ᴏғ ᴛʜᴇ sᴀᴍᴇ ʀᴀʀɪᴛʏ."
  - "[if:enabled]<#F4B554>④ <gray>ᴘᴜʟʟɪɴɢ ᴀ {rarity}<gray> ᴅᴏᴇs <white>ɴᴏᴛ<gray> ʀᴇsᴇᴛ ʏᴏᴜʀ sᴘᴀʀᴋ ᴘᴏɪɴᴛs."
  - "[if:enabled][if:ten-guarantee]<#F4B554>⑤ <gray>ᴛʜᴇ x10 ᴘᴜʟʟ ɢᴜᴀʀᴀɴᴛᴇᴇs ᴀᴛ ʟᴇᴀsᴛ 1 {ten-rarity}<gray> ᴏʀ ᴀʙᴏᴠᴇ."
  - "[if:enabled]"
  - "[if:enabled]<dark_gray>sᴘᴀʀᴋ ɪs ᴛʀᴀᴄᴋᴇᴅ sᴇᴘᴀʀᴀᴛᴇʟʏ ғᴏʀ ᴇᴀᴄʜ ʙᴀɴɴᴇʀ."

# ---------------------------------------------------------------------
#  Menu chinh (/gacha).  Bien tieu de: {banner}
#
#   ~ ~ ~ ~ @ ~ ~ ~ ~      @  = ho so nguoi choi (o 4), ▼ = dau chi banner dang chon
#   ~ . . [B] . [B] . . ~   [B] = tab banner (cach nhau 1 o)
#   ~ . o ★ [i] ★ o . ~    [i] = thong tin banner, ★ = vat pham noi bat
#   ~ . x1 o SPARK o x10 . ~
#   ~ . . TL . HA . LS . ~  TL = ty le, HA = hoat anh, LS = lich su
#   ~ ~ ~ ~ X ~ ~ ~ ~      X = dong
# ---------------------------------------------------------------------
main:
  title: "<gradient:#F4B554:#F6955D><bold>ᴇxᴛʀᴀᴄᴛɪᴏɴ"
  rows: 6
  layout:
    - "~~~~~~~~~"
    - "~=======~"
    - "~#o###o#~"
    - "~##*#*##~"
    - "~=======~"
    - "~~~~~~~~~"

  # Ho so nguoi choi: dau skin cua chinh nguoi choi. Ghi "enabled: false" de tat.
  # Bien : {player} {balance} {total} {spark} {threshold} {pity} {used} {max}
  # Dieu kien: spark (banner co spark), limit (banner gioi han luot)
  profile:
    slot: 4
    material: PLAYER_HEAD
    name: "<gradient:#F4B554:#F6955D><bold>{player}"
    lore:
      - "<#4a3d30>━━━━━━━━━━━━━━━━━━━━"
      - "<#8a7a66>ʙᴀʟᴀɴᴄᴇ <dark_gray>» <white>{balance}"
      - "<#8a7a66>ᴛᴏᴛᴀʟ ᴘᴜʟʟs <dark_gray>» <white>{total}"
      - "<#8a7a66>sɪɴᴄᴇ ʟᴀsᴛ ʀᴀʀᴇ <dark_gray>» <white>{pity}"
      - "[if:spark]<#8a7a66>sᴘᴀʀᴋ <dark_gray>» <white>{spark}<dark_gray>/<white>{threshold}"
      - "[if:limit]<#8a7a66>ᴘᴜʟʟs ᴜsᴇᴅ <dark_gray>» <white>{used}<dark_gray>/<white>{max}"

  # Thanh chon banner. Hinh dang lay tu icon cua banner (trong banners.yml).
  # Vi tri: "slots: [..]" neu muon dat tay, neu khong thi can giua quanh center-slot,
  #         spacing = khoang cach giua 2 tab (2 = chua 1 o trong).
  # Bien : {banner} {remaining} {cost} {max} {rarity}
  # Dieu kien: limited, normal, limit (banner gioi han luot), guarantee (luon ra do hiem toi thieu), selected
  banner-tab:
    center-slot: 13
    spacing: 2
    max: 7
    name: "{banner}"
    glow: selected             # chi sang khi dang chon
    lore:
      - "<#4a3d30>━━━━━━━━━━━━━━━━━━━━"
      - "[if:limited]<light_purple>✦ ʟɪᴍɪᴛᴇᴅ ʙᴀɴɴᴇʀ"
      - "[if:normal]<green>✦ sᴛᴀɴᴅᴀʀᴅ ʙᴀɴɴᴇʀ (ᴘᴇʀᴍᴀɴᴇɴᴛ)"
      - "[if:limited]<#8a7a66>ʀᴇᴍᴀɪɴɪɴɢ <dark_gray>» <white>{remaining}"
      - "<#8a7a66>ᴘᴜʟʟ x1 <dark_gray>» <#F4B554>{cost}"
      - "[if:limit]<#8a7a66>ʟɪᴍɪᴛ <dark_gray>» <white>{max}<#8a7a66> ᴘᴜʟʟs/ᴘʟᴀʏᴇʀ"
      - "[if:guarantee]<#8a7a66>ɢᴜᴀʀᴀɴᴛᴇᴇᴅ <dark_gray>» {rarity}"
      - ""
      - "[if:selected]<#F4B554>▶ sᴇʟᴇᴄᴛᴇᴅ"
      - "[if:!selected]<#F4B554>▶ ᴄʟɪᴄᴋ ᴛᴏ sᴇʟᴇᴄᴛ"
    # Dau chi banner dang chon: dat cach tab "offset" o (-9 = ngay o tren). Ghi "enabled: false" de tat.
    # Chi hien neu o do khong co nut khac. Bien: {banner}
    marker:
      offset: -9
      material: YELLOW_STAINED_GLASS_PANE
      name: "<#F4B554>▼ {banner}"
      glow: true

  # Thong tin banner dang chon. Khoi {description} = mo ta trong banners.yml.
  # Bien : {banner} {cycle} {remaining} {rarity} {used} {max}
  # Dieu kien: limited, normal, override (admin chon tay), guarantee, limit
  banner-info:
    slot: 22
    name: "{banner}"
    glow: true
    lore:
      - "<#4a3d30>━━━━━━━━━━━━━━━━━━━━"
      - "{description}"
      - "<#4a3d30>━━━━━━━━━━━━━━━━━━━━"
      - "[if:limited]<#F4B554>⌛ <#8a7a66>ᴄʏᴄʟᴇ <white>#{cycle} <dark_gray>· <white>{remaining} <#8a7a66>ʟᴇғᴛ"
      - "[if:limited][if:override]<dark_gray>(ʙᴀɴɴᴇʀ ᴄʜᴏsᴇɴ ʙʏ ᴀɴ ᴀᴅᴍɪɴɪsᴛʀᴀᴛᴏʀ)"
      - "[if:normal]<green>∞ <#8a7a66>ᴘᴇʀᴍᴀɴᴇɴᴛ ʙᴀɴɴᴇʀ"
      - "[if:guarantee]<#F4B554>✦ <#8a7a66>ᴇᴠᴇʀʏ ᴘᴜʟʟ ɢᴜᴀʀᴀɴᴛᴇᴇs {rarity}<#8a7a66> ᴏʀ ᴀʙᴏᴠᴇ"
      - "[if:limit]<#F4B554>✦ <#8a7a66>ᴘᴜʟʟs ᴜsᴇᴅ <white>{used}<dark_gray>/<white>{max}"

  # Hai o trung bay vat pham noi bat (dung reward-card)
  showcase-slots: [21, 23]

  # Nut quay x1.  Bien: {cost} {balance}
  pull-single:
    slot: 29
    material: GOLD_NUGGET
    name: "<gradient:#F4B554:#F6955D><bold>ᴘᴜʟʟ x1"
    lore:
      - "<#4a3d30>━━━━━━━━━━━━━━━━━━━━"
      - "<#8a7a66>ᴄᴏsᴛ <dark_gray>» <#F4B554>{cost}"
      - "<#8a7a66>ʏᴏᴜ ʜᴀᴠᴇ <dark_gray>» <white>{balance}"
      - ""
      - "<#F4B554>▶ ᴄʟɪᴄᴋ ᴛᴏ ᴘᴜʟʟ"
  # Thay cho nut quay x1 khi het luot (banner gioi han luot).  Bien: {max}
  pull-single-exhausted:
    slot: 29
    material: BARRIER
    name: "<red><bold>ᴏᴜᴛ ᴏғ ᴘᴜʟʟs"
    lore:
      - "<#4a3d30>━━━━━━━━━━━━━━━━━━━━"
      - "<gray>ʏᴏᴜ ʜᴀᴠᴇ ᴜsᴇᴅ ᴀʟʟ <white>{max}<gray> ᴘᴜʟʟs ᴏɴ ᴛʜɪs ʙᴀɴɴᴇʀ."

  # Nut quay x10.  Bien: {cost} {balance} {saved} {ten-rarity}
