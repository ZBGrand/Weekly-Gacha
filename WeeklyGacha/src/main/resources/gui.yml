# ---------------------------------------------------------------------
#  Man hinh ket qua quay (5 hang).  Bien tieu de: {count} {banner}
#
#   ~ ~ ~ ~ S ~ ~ ~ ~      S = tom tat
#   ~ . 1 2 3 4 5 . ~      10 the (quay x10)
#   ~ o . . 1 . . o ~      1 the (quay x1) nam giua
#   ~ . 6 7 8 9 10 . ~
#   ~ ~ ~ < X > ~ ~ ~      < quay lai, X bo qua (khi dang chay hoat anh), > quay tiep
# ---------------------------------------------------------------------
result:
  title: "<gradient:#F4B554:#F6955D><bold>ᴇxᴛʀᴀᴄᴛɪᴏɴ</bold></gradient> <dark_gray>— x{count}"
  rows: 5
  layout:
    - "~~~~~~~~~"
    - "~#######~"
    - "~o#####o~"
    - "~#######~"
    - "~~~~~~~~~"
  slots-single: [22]                              # vi tri the khi quay x1
  slots-multi: ["11-15", "29-33"]                 # vi tri 10 the khi quay x10
  # Sau khi lat het the: vien (ky tu trong "symbols") doi sang mau do hiem cao nhat vua ra,
  # neu do hiem do >= min-rarity. Trong frames, RARITY = tam kinh cua do hiem do (muc rarity.*.pane).
  tint:
    symbols: "~"
    min-rarity: RARE
    mode: chase
    speed: 1
    frames: [WHITE_STAINED_GLASS_PANE, RARITY, RARITY, RARITY, BLACK_STAINED_GLASS_PANE, BLACK_STAINED_GLASS_PANE, BLACK_STAINED_GLASS_PANE, BLACK_STAINED_GLASS_PANE]
  # Tom tat.  Bien: {count} {banner-plain}.  Khoi {rarity-lines}: moi do hiem co mat 1 dong theo rarity-line
  summary:
    slot: 4
    material: NETHER_STAR
    name: "<gradient:#F4B554:#F6955D><bold>ᴘᴜʟʟ ʀᴇsᴜʟᴛ x{count}"
    lore:
      - "<#4a3d30>━━━━━━━━━━━━━━━━━━━━"
      - "<#8a7a66>ʙᴀɴɴᴇʀ <dark_gray>» <white>{banner-plain}"
      - ""
      - "{rarity-lines}"
  rarity-line: "<dark_gray>▪ {rarity}<dark_gray> » <white>{count}"    # Bien: {rarity} {count}
  skip:                        # nut Bo qua trong luc chay hoat anh
    slot: 40
    material: BARRIER
    name: "<red><bold>sᴋɪᴘ"
    lore:
      - "<gray>ʀᴇᴠᴇᴀʟ ᴀʟʟ ʀᴇsᴜʟᴛs ɪᴍᴍᴇᴅɪᴀᴛᴇʟʏ."
