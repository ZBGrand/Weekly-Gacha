name: WeeklyGacha
version: '${project.version}'
main: com.weeklygacha.WeeklyGachaPlugin
api-version: '1.21'
description: Gacha voi banner xoay vong 14 ngay, spark, MMOItems/ItemsAdder, Lunacy/PlayerPoints/key
authors: [WeeklyGacha]

softdepend: [PlayerPoints, MMOItems, MythicLib, ItemsAdder, PlaceholderAPI]

commands:
  gacha:
    description: Mo giao dien gacha
    usage: /<command> [open|pull|rates|history|spark|animation|info]
    aliases: [wgacha]
    permission: weeklygacha.use
  lunacy:
    description: Xem so du Lunacy, mo cua hang, mua Lunacy bang PlayerPoints
    usage: /<command> [balance|shop|buy <goi|so luong>|top]
    aliases: [luna]
    permission: weeklygacha.use
  gachaadmin:
    description: Lenh quan tri WeeklyGacha
    usage: /<command> <info|list|setbanner|auto|next|restartcycle|reload|resetspark|resetlimit|history|check|givekey|lunacy>
    aliases: [gadmin]
    permission: weeklygacha.admin

permissions:
  weeklygacha.use:
    description: Cho phep dung /gacha va quay
    default: true
  weeklygacha.admin:
    description: Cho phep dung /gachaadmin
    default: op
