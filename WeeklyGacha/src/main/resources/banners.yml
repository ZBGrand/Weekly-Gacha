        item: IRON_INGOT
        amount: 16
        rarity: COMMON
        chance: 34
      cooked_beef:
        provider: VANILLA
        item: COOKED_BEEF
        amount: 32
        rarity: COMMON
        chance: 28
      xp_bottles:
        provider: VANILLA
        item: EXPERIENCE_BOTTLE
        amount: 32
        rarity: UNCOMMON
        chance: 20
      diamonds:
        provider: VANILLA
        item: DIAMOND
        amount: 3
        rarity: RARE
        chance: 6
      xp_pouch:
        provider: COMMAND
        name: "<aqua>Túi kinh nghiệm"
        icon: EXPERIENCE_BOTTLE
        commands:
          - "experience add {player} 500 points"
        rarity: RARE
        chance: 5
      golden_apple:
        provider: VANILLA
        item: ENCHANTED_GOLDEN_APPLE
        rarity: EPIC
        chance: 3.4
      totem:
        provider: VANILLA
        item: TOTEM_OF_UNDYING
