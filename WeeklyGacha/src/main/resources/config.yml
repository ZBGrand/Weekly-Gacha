# =====================================================================
#  WeeklyGacha - cau hinh chinh
#  Moi chuoi van ban dung dinh dang MiniMessage: <gold>, <bold>, <gradient:#fff:#000> ...
# =====================================================================

settings:
  # Thoi gian cho giua 2 lan quay (ms) de chong spam click
  pull-cooldown-ms: 500
  # Do hiem nao se duoc thong bao toan server (co the ghi de bang "broadcast: true/false" o tung vat pham)
  broadcast-rarities: [LEGENDARY]

# ---------------------------------------------------------------------
#  Hoat anh quay kieu Limbus Company (xao the -> the phat sang theo do hiem -> lat the)
#  Don vi la tick (20 tick = 1 giay). Nguoi choi co the tat rieng bang /gacha animation.
#  Qua chi duoc trao SAU khi hoat anh chay xong (hoac khi bam Bo qua / dong GUI / thoat game / tat server).
# ---------------------------------------------------------------------
animation:
  enabled: true
  spin-ticks: 24
  reveal-delay-ticks: 6
  top-pause-ticks: 14

# ---------------------------------------------------------------------
#  Chu ky banner gioi han
# ---------------------------------------------------------------------
cycle:
  # Moc bat dau chu ky dau tien. Dinh dang: yyyy-MM-dd hoac "yyyy-MM-dd HH:mm".
  # De trong => dung thoi diem plugin chay lan dau.
  # Luu y: neu admin da dung /gachaadmin restartcycle thi moc luu trong data.db se duoc uu tien.
  start-date: "2026-10-13"
  timezone: "Asia/Ho_Chi_Minh"
  length-days: 14
  # Thu tu xoay vong cua cac banner type LIMITED (de trong => tat ca banner LIMITED theo thu tu khai bao)
  # Hien chi co 1 banner gioi han; them banner LIMITED khac vao day de xoay vong moi 14 ngay.
  rotation: [new_item_target_extraction]
  # true: banner do admin chon thu cong chi co hieu luc den het chu ky hien tai
  # false: giu mai cho den khi dung /gachaadmin auto
  clear-override-on-new-cycle: true

# ---------------------------------------------------------------------
#  Banner
#  - type: NORMAL (luon mo) | LIMITED (xoay vong theo chu ky)
#  - rewards.<id>: moi vat pham co "chance" (%) rieng. Tong nen = 100, neu lech plugin se tu chuan hoa.
#      provider: MMOITEMS | ITEMSADDER | VANILLA | COMMAND
#        MMOITEMS   -> type: <loai MMOItems, vd SWORD>   item: <ID_MMOITEMS>
#        ITEMSADDER -> item: <namespace:id>
#        VANILLA    -> item: <MATERIAL>  (co the them name/lore)
#        COMMAND    -> commands: [ "lenh chay bang console, {player} = ten nguoi choi" ]  icon: <MATERIAL>
#      rarity: COMMON | UNCOMMON | RARE | EPIC | LEGENDARY
#      featured: true => vat pham "nang" cua banner (dung cho co che dam bao)
#  - cost: chi phi quay. KHONG dung Vault nua.
#      type: PLAYERPOINTS   tru diem PlayerPoints cua nguoi choi (cai plugin PlayerPoints)
#      type: ITEM           tru vat pham (key) trong tui do, key co the la:
#        cost.item.provider: MMOITEMS   -> type: <loai MMOItems>   item: <ID_MMOITEMS>
#        cost.item.provider: ITEMSADDER -> item: <namespace:id>
#        cost.item.provider: VANILLA    -> item: <MATERIAL>, co the khop them name / custom-model-data
#                                          (dung cho key cua plugin khac hoac key che tao bang lenh/recipe)
#      single / ten: so diem hoac so key cho 1 luot / 10 luot
#    Admin phat key bang: /gachaadmin givekey <nguoi choi> <banner> [so luong]
#  - spark: he thong kieu Limbus Company
#      threshold         moi luot quay +1 diem spark; du threshold diem thi doi 1 vat pham (nguoi choi tu chon)
#      rarity            do hiem cua vat pham co the doi (uu tien cac vat pham featured)
#      ten-guarantee     quay x10 chac chan co it nhat 1 vat pham tu do hiem nay tro len (NONE de tat)
#    Ra do hiem cao khi quay KHONG lam mat diem spark. Spark tinh rieng cho tung nguoi choi va tung banner.
#  - limit.max-pulls      so luot toi da MOI NGUOI CHOI duoc quay tren banner nay suot doi (0 = khong gioi han).
#                         Dat 1 => chi quay duoc 1 lan duy nhat (khong the quay x10). Admin xoa bang /gachaadmin resetlimit.
#  - guarantee.rarity     MOI luot quay cua banner chac chan ra do hiem nay tro len (de trong / NONE de tat).
#                         Banner phai co it nhat 1 vat pham dat do hiem do.
# ---------------------------------------------------------------------
banners:

  # ===================================================================
  #  1) Standard Extraction - banner thuong, luon mo
  # ===================================================================
  standard_extraction:
    type: NORMAL
    display-name: "<green><bold>Standard Extraction"
    icon: CHEST
    description:
      - "<gray>Banner vĩnh viễn, luôn mở."
      - "<gray>Phần thưởng cơ bản và vài vật phẩm quý."
    cost:
      type: PLAYERPOINTS
      single: 100
      ten: 900
    spark:
      enabled: true
      threshold: 300
      rarity: LEGENDARY
      ten-guarantee: RARE
    rewards:
      iron_ingot:
        provider: VANILLA
        item: IRON_INGOT
        amount: 16
        rarity: COMMON
        chance: 34
      cooked_beef:
        provider: VANILLA
        item: COOKED_BEEF
        amount: 32
        rarity: COMMON
        chance: 28
      xp_bottles:
        provider: VANILLA
        item: EXPERIENCE_BOTTLE
        amount: 32
        rarity: UNCOMMON
        chance: 20
      diamonds:
        provider: VANILLA
        item: DIAMOND
        amount: 3
        rarity: RARE
        chance: 6
      xp_pouch:
        provider: COMMAND
        name: "<aqua>Túi kinh nghiệm"
        icon: EXPERIENCE_BOTTLE
        commands:
          - "experience add {player} 500 points"
        rarity: RARE
        chance: 5
      golden_apple:
        provider: VANILLA
        item: ENCHANTED_GOLDEN_APPLE
        rarity: EPIC
        chance: 3.4
      totem:
        provider: VANILLA
        item: TOTEM_OF_UNDYING
        rarity: EPIC
        chance: 2.0
      netherite_ingot:
        provider: VANILLA
        item: NETHERITE_INGOT
        amount: 2
        rarity: LEGENDARY
        chance: 0.9
      elytra:
        provider: VANILLA
        item: ELYTRA
        rarity: LEGENDARY
        chance: 0.7

  # ===================================================================
  #  2) New Item Target Extraction - banner gioi han, xoay vong moi 14 ngay
  #     Tang ty le vat pham MOI (featured). Doi vat pham mau bang item that cua server.
  # ===================================================================
  new_item_target_extraction:
    type: LIMITED
    display-name: "<gradient:#ff5f6d:#ffc371><bold>New Item Target Extraction"
    icon: DRAGON_HEAD
    description:
      - "<gray>Banner giới hạn theo chu kỳ 14 ngày."
      - "<yellow>Tăng tỷ lệ các vật phẩm mới: <gold>Kiếm Mục Tiêu<yellow>, <gold>Giáp Mục Tiêu"
    cost:
      type: ITEM
      single: 1
      ten: 9
      item:
        # Key vanilla de chay duoc ngay. Doi sang key that cua server (MMOItems / ItemsAdder / plugin khac):
        provider: VANILLA
        item: TRIPWIRE_HOOK
        name: "<gold>Extraction Key"
        # custom-model-data: 1001
        # provider: MMOITEMS
        # type: MISCELLANEOUS
        # item: EXTRACTION_KEY
        # provider: ITEMSADDER
        # item: myset:extraction_key
    spark:
      enabled: true
      threshold: 200
      rarity: LEGENDARY
      ten-guarantee: RARE
    rewards:
      # ---- Vi du dung MMOItems / ItemsAdder (bo dau # va sua ID cho khop server cua ban) ----
      # target_blade:
      #   provider: MMOITEMS
      #   type: SWORD
      #   item: NEW_BLADE
      #   rarity: LEGENDARY
      #   chance: 0.8
      #   featured: true
      # target_wings:
      #   provider: ITEMSADDER
      #   item: myset:new_wings
      #   rarity: LEGENDARY
      #   chance: 0.8
      #   featured: true
      target_sword:
        provider: VANILLA
        item: NETHERITE_SWORD
        name: "<gold>Kiếm Mục Tiêu"
        lore:
          - "<gray>Vật phẩm mới của banner Target"
        rarity: LEGENDARY
        chance: 0.8
        featured: true
      target_armor:
        provider: VANILLA
        item: NETHERITE_CHESTPLATE
        name: "<gold>Giáp Mục Tiêu"
        lore:
          - "<gray>Vật phẩm mới của banner Target"
        rarity: LEGENDARY
        chance: 0.8
        featured: true
      elytra:
        provider: VANILLA
        item: ELYTRA
        rarity: LEGENDARY
        chance: 0.4
      golden_apple:
        provider: VANILLA
        item: ENCHANTED_GOLDEN_APPLE
        amount: 2
        rarity: EPIC
        chance: 3
      totem:
        provider: VANILLA
        item: TOTEM_OF_UNDYING
        rarity: EPIC
        chance: 3
      diamonds:
        provider: VANILLA
        item: DIAMOND
        amount: 5
        rarity: RARE
        chance: 12
      xp_bottles:
        provider: VANILLA
        item: EXPERIENCE_BOTTLE
        amount: 64
        rarity: UNCOMMON
        chance: 20
      iron_ingot:
        provider: VANILLA
        item: IRON_INGOT
        amount: 24
        rarity: COMMON
        chance: 35
      blaze_rod:
        provider: VANILLA
        item: BLAZE_ROD
        amount: 16
        rarity: COMMON
        chance: 25

  # ===================================================================
  #  3) Assured Extraction - moi nguoi chi quay duoc 1 LAN DUY NHAT,
  #     chac chan ra vat pham Legendary. Khong co spark, khong quay x10.
  # ===================================================================
  assured_extraction:
    type: NORMAL
    display-name: "<gradient:#f6d365:#fda085><bold>Assured Extraction"
    icon: NETHER_STAR
    description:
      - "<gray>Mỗi người chơi chỉ được quay <white>1 lần duy nhất<gray>."
      - "<gray>Chắc chắn nhận vật phẩm <gold>Huyền thoại<gray>."
    cost:
      type: PLAYERPOINTS
      single: 500
    limit:
      max-pulls: 1
    guarantee:
      rarity: LEGENDARY
    spark:
      enabled: false
      ten-guarantee: NONE
    rewards:
      elytra:
        provider: VANILLA
        item: ELYTRA
        rarity: LEGENDARY
        chance: 25
      netherite_ingot:
        provider: VANILLA
        item: NETHERITE_INGOT
        amount: 4
        rarity: LEGENDARY
        chance: 35
      trident:
        provider: VANILLA
        item: TRIDENT
        rarity: LEGENDARY
        chance: 20
      mace:
        provider: VANILLA
        item: MACE
        rarity: LEGENDARY
        chance: 10
      netherite_template:
        provider: VANILLA
        item: NETHERITE_UPGRADE_SMITHING_TEMPLATE
        amount: 2
        rarity: LEGENDARY
        chance: 10

