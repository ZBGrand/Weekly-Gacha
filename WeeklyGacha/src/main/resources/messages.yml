  - "<gray>Bắt đầu: <white><start>"
  - "<gray>Kết thúc: <white><end> <gray>(còn <white><remaining><gray>)"
  - "<gray>Banner giới hạn đang mở: <white><active>"
  - "<gray>Đang ghi đè thủ công: <white><override>"
admin-banner-set: "<green>Đã đặt banner giới hạn hiện tại thành <banner><green>."
