# =====================================================================
#  WeeklyGacha - tin nhan (messages.yml)
#  Chay /gachaadmin reload sau khi sua.
#  Dung MiniMessage: <gold>, <bold>, <gradient:#ffb347:#ffcc33> ...
#  Placeholder dang <ten>, vi du <player>, <banner>, <cost>; moi tin nhan dung bien khac nhau.
#  Khoa "prefix" duoc them vao dau moi tin nhan gui cho nguoi choi (khong ap dung cho danh sach nhieu dong).
#  Chu trong giao dien GUI (menu, nut, lore) nam o gui.yml.
# =====================================================================

prefix: "<gradient:#ffb347:#ffcc33><bold>WeeklyGacha</bold></gradient> <dark_gray>» </dark_gray>"
no-permission: "<red>Bạn không có quyền thực hiện điều này."
players-only: "<red>Lệnh này chỉ dùng được trong game."
data-loading: "<yellow>Dữ liệu của bạn đang được tải, hãy thử lại sau giây lát."
no-banner: "<red>Hiện chưa có banner nào đang mở."
banner-not-found: "<red>Không tìm thấy banner <white><id></white>."
banner-inactive: "<red>Banner này hiện không mở."
cost-provider-missing: "<red>Banner này cần plugin <white><plugin></white> nhưng plugin chưa được bật. Hãy báo quản trị viên."
not-enough-cost: "<red>Bạn cần <white><cost></white> nhưng chỉ có <white><balance></white>."
charge-failed: "<red>Không thể trừ <white><cost></white>. Bạn chưa bị mất gì."
reward-unavailable: "<red>Vật phẩm <white><reward></white> chưa sẵn sàng (lỗi cấu hình). Bạn chưa bị mất điểm/key."
cooldown: "<gray>Bạn thao tác quá nhanh, hãy chờ một chút."
pull-summary: "<green>Đã quay <white><count></white> lượt tại <banner><green> — tiêu tốn <white><cost></white>."
pull-line: "<gray> • <item> <dark_gray>(x<amount>)"
broadcast-rare: "<gold>★ <white><player></white> vừa quay được <item><gold> tại <banner><gold> (<white><pity></white> lượt kể từ lần hiếm trước)!"
cycle-changed: "<gold>Banner giới hạn mới đã mở: <banner><gold>! Dùng <white>/gacha</white> để thử vận may."
history-error: "<red>Không thể tải lịch sử, hãy thử lại sau."
pending-recovered: "<green>Bạn đã nhận lại <white><count></white> phần thưởng chưa kịp trao ở lần quay trước."
animation-on: "<green>Đã bật hoạt ảnh quay."
animation-off: "<yellow>Đã tắt hoạt ảnh quay (kết quả hiện ngay)."
spark-disabled: "<red>Banner này không có spark hoặc vật phẩm không hợp lệ."
spark-not-ready: "<red>Chưa đủ điểm spark: <white><current></white>/<white><threshold></white>."
spark-exchanged: "<green>Đã đổi spark lấy <item><green> tại <banner><green>!"
help:
  - "<gold>/gacha <gray>- mở giao diện gacha"
  - "<gold>/gacha pull [1|10] [banner] <gray>- quay nhanh"
  - "<gold>/gacha rates [banner] <gray>- xem tỷ lệ"
  - "<gold>/gacha history <gray>- lịch sử quay"
  - "<gold>/gacha spark [banner] <gray>- xem tiến độ spark"
  - "<gold>/gacha animation <gray>- bật/tắt hoạt ảnh quay"
  - "<gold>/gacha info <gray>- banner đang mở"
info-line: "<gray> • <banner><gray> — <type><gray> — còn <white><remaining>"
admin-usage:
  - "<gold>/gachaadmin info <gray>- thông tin chu kỳ"
  - "<gold>/gachaadmin list <gray>- danh sách banner"
  - "<gold>/gachaadmin setbanner <id> <gray>- đổi banner giới hạn thủ công"
  - "<gold>/gachaadmin auto <gray>- quay lại xoay vòng tự động"
  - "<gold>/gachaadmin next <gray>- chuyển sang banner kế tiếp"
  - "<gold>/gachaadmin restartcycle [config|yyyy-MM-dd] <gray>- đặt lại mốc chu kỳ"
  - "<gold>/gachaadmin reload <gray>- nạp lại cấu hình"
  - "<gold>/gachaadmin resetspark <người chơi> [banner] <gray>- xoá điểm spark"
  - "<gold>/gachaadmin resetlimit <người chơi> [banner] <gray>- xoá số lượt đã dùng (banner giới hạn lượt)"
  - "<gold>/gachaadmin history <người chơi> [số dòng] <gray>- xem lịch sử"
  - "<gold>/gachaadmin check <gray>- kiểm tra vật phẩm và chi phí cấu hình"
  - "<gold>/gachaadmin givekey <người chơi> <banner> [số lượng] <gray>- phát key quay"
admin-info:
