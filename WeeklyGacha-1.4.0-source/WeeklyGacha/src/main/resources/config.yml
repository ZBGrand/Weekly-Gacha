# =====================================================================
#  WeeklyGacha - cau hinh chinh (config.yml)
#
#  Plugin dung 4 file cau hinh trong thu muc plugins/WeeklyGacha/:
#    config.yml    cai dat chung, thoi gian hoat anh, chu ky banner       (file nay)
#    banners.yml   danh sach banner, vat pham, ty le, chi phi, spark
#    messages.yml  tin nhan chat / lenh
#    gui.yml       giao dien: chu, vat pham, vi tri o, am thanh, hoat anh
#  Sau khi sua bat ky file nao, chay /gachaadmin reload.
# =====================================================================

settings:
  # Thoi gian cho giua 2 lan quay (ms) de chong spam click
  pull-cooldown-ms: 500
  # Do hiem nao se duoc thong bao toan server (co the ghi de bang "broadcast: true/false" o tung vat pham)
  broadcast-rarities: [LEGENDARY]

# ---------------------------------------------------------------------
#  Hoat anh quay kieu Limbus Company (xao the -> the phat sang theo do hiem -> lat the)
#  O day chi chinh THOI GIAN (don vi tick, 20 tick = 1 giay) va bat/tat. Hinh anh, mau, am thanh: xem gui.yml.
#  Nguoi choi co the tat rieng cho minh bang /gacha animation.
#  Qua chi duoc trao SAU khi hoat anh chay xong (hoac khi bam Bo qua / dong GUI / thoat game / tat server).
# ---------------------------------------------------------------------
animation:
  enabled: true
  spin-ticks: 24
  reveal-delay-ticks: 6
  top-pause-ticks: 14

# ---------------------------------------------------------------------
#  Chu ky banner gioi han
# ---------------------------------------------------------------------
cycle:
  # Moc bat dau chu ky dau tien. Dinh dang: yyyy-MM-dd hoac "yyyy-MM-dd HH:mm".
  # De trong => dung thoi diem plugin chay lan dau.
  # Luu y: neu admin da dung /gachaadmin restartcycle thi moc luu trong data.db se duoc uu tien.
  start-date: "2026-10-13"
  timezone: "Asia/Ho_Chi_Minh"
  length-days: 14
  # Thu tu xoay vong cua cac banner type LIMITED (de trong => tat ca banner LIMITED theo thu tu khai bao)
  # Hien chi co 1 banner gioi han; them banner LIMITED khac vao day de xoay vong moi 14 ngay.
  rotation: [new_item_target_extraction]
  # true: banner do admin chon thu cong chi co hieu luc den het chu ky hien tai
  # false: giu mai cho den khi dung /gachaadmin auto
  clear-override-on-new-cycle: true
